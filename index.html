<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>志勇小組奉獻累計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style id="page-style">
/* 版面：手機單欄直排（標題→錢袋→金額→三顆按鈕往下滑），功能從底部抽屜拉出；
   電腦把錢袋放大、三顆按鈕橫排，功能開在畫面中央的 RPG 對話視窗。白底單一主題。 */
:root{
  --bg:#FFFFFF; --ink:#241311; --ink-2:#6E5D58; --velvet:#7A2E25; --velvet-2:#511D17;
  --gold:#F2C230; --gold-2:#C98E17; --gold-soft:#FFF3C9; --cream:#FBF4E6; --line:#EADFDB;
  --plus:#1F7A47; --minus:#B03A2E; --scrim:rgba(36,19,17,.6);
  --f-num:"Press Start 2P",ui-monospace,Menlo,monospace;
  --f-px:"Press Start 2P",ui-monospace,Menlo,monospace;
  --f-body:"PingFang TC","Heiti TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif;
  --u:4px; --bag-s:5; --title-s:2.5; --ih:44px;
  --px4:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink);
  --px2:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;
  -webkit-text-size-adjust:100%}
/* 錢袋特效畫布比錢袋大，左右超出畫面的部分裁掉，避免出現橫向捲軸 */
html,body{overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
html.lock,html.lock body{overflow:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1000px;margin:0 auto}
.pxt{display:inline-flex;line-height:0;vertical-align:middle;flex:none}
.pxt canvas{display:block;width:calc(var(--pw)*var(--ps,2)*1px);height:calc(var(--ph)*var(--ps,2)*1px);image-rendering:pixelated}
.ico{display:block;flex:none;width:calc(var(--pw)*var(--is,3)*1px);height:calc(var(--ph)*var(--is,3)*1px);image-rendering:pixelated}

/* ---- 按鈕：像素外框＋底部厚邊，按下會往下壓 ---- */
.btn{--face:#FFFFFF;--shade:#F1E4C3;
  appearance:none;border:0;border-radius:0;margin:4px 4px 8px;font:inherit;color:var(--ink);background:var(--face);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:12px 18px;position:relative;
  box-shadow:var(--px4),0 8px 0 0 var(--ink),inset 0 -4px 0 0 var(--shade);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;--ps:2;--is:3}
.btn:hover{--face:#FFFBEA}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:var(--px4),inset 0 4px 0 0 var(--shade)}
.btn:focus-visible{outline:3px dashed var(--velvet);outline-offset:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-gold{--face:var(--gold);--shade:var(--gold-2)}
.btn-gold:hover{--face:#F7CF4E}
.btn-danger{--face:#FBE3DF;--shade:#E9B8B0}
.btn-danger:hover{--face:#FDECE9}
.btn-sm{padding:8px 12px;gap:8px;--ps:1;--is:2}
.btn-icon{padding:8px;--is:3}
.wide{width:calc(100% - 8px)}

/* ---- 首頁上半：標題、錢袋、金額 ---- */
.topbar{display:flex;justify-content:flex-end;padding-top:12px;min-height:24px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center}
.hero-title{margin:4px 0 0;--ps:var(--title-s);text-wrap:balance}
.bag-stage{position:relative;width:min(calc(64px*var(--bag-s)),100%);aspect-ratio:64/76;margin-top:calc(-5px*var(--bag-s))}
.bag-btn{appearance:none;border:0;background:none;padding:0;margin:0;display:block;width:100%;height:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bag-btn:focus-visible{outline:4px dashed var(--gold-2);outline-offset:-10px}
.bag-cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.fx-cv{position:absolute;pointer-events:none;image-rendering:pixelated}
.bag-btn.hop .bag-cv{animation:hop .5s steps(2,end) 1;transform-origin:50% 93%}
@keyframes hop{0%{transform:none}15%{transform:scale(1.07,.9)}40%{transform:translateY(-7%) scale(.95,1.06)}65%{transform:scale(1.04,.95)}82%{transform:translateY(-2%)}100%{transform:none}}
.say{position:absolute;left:50%;top:9%;transform:translateX(-50%);pointer-events:none;background:#fff;padding:8px 10px;box-shadow:var(--px4);--ps:2;white-space:nowrap}
.say.show{animation:say 1.3s steps(10,end) forwards}
@keyframes say{0%{transform:translate(-50%,10px);opacity:0}12%{transform:translate(-50%,0);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-16px);opacity:0}}
.ptag{position:absolute;left:50%;bottom:0;transform:translateX(-50%);white-space:nowrap;background:var(--gold-soft);font-weight:700;font-size:13px;padding:2px 10px;box-shadow:var(--px2)}
.hint{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.stage-cap{margin:18px 0 6px;font-size:13px;color:var(--ink-2)}
.stages{display:grid;grid-template-columns:repeat(6,auto);gap:4px;justify-content:center}
.stg{appearance:none;border:0;background:none;margin:0;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:4px 2px 4px;color:var(--ink-2);-webkit-tap-highlight-color:transparent}
.stg canvas{display:block;width:48px;height:70px;image-rendering:pixelated}
.stg span{font:400 9px/1.2 var(--f-px)}
.stg.cur{background:var(--gold-soft);box-shadow:var(--px2);color:var(--ink)}
.stg.pv{outline:2px dashed var(--velvet);outline-offset:-2px}
.stg:focus-visible{outline:3px dashed var(--velvet)}
.total{margin-top:26px;display:grid;justify-items:center;gap:12px;width:100%}
.total h2{margin:0;--ps:2}
.amount{display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:wrap;font:400 clamp(24px,8vw,44px)/1.25 var(--f-num);color:var(--ink);font-variant-numeric:tabular-nums}
.amount small{font:400 14px var(--f-px);color:var(--velvet)}
.amount.neg{color:var(--minus)}
.bar{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:min(300px,100%);padding:4px;box-shadow:var(--px4);margin:4px;box-sizing:border-box}
.bar i{height:12px;background:#F1E9E6}
.bar i.on{background:var(--gold);box-shadow:inset 0 -3px 0 var(--gold-2),inset 0 3px 0 #FFE27A}
.next{margin:0;color:var(--ink-2);font-size:14px;text-wrap:balance}

/* ---- 三顆主要按鈕 ---- */
.actions{display:grid;gap:14px;max-width:460px;margin:40px auto 0}
.btn-main{justify-content:flex-start;min-height:76px;padding:14px 20px;gap:16px;--ps:2;--is:3}
.btn-main .chev{margin-left:auto;--is:2}
.foot{margin:40px auto 0;max-width:640px;text-align:center;color:var(--ink-2);font-size:13px;display:grid;gap:4px}
.foot p{margin:0}

/* ---- 抽屜／對話視窗 ---- */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:repeating-conic-gradient(var(--scrim) 0 25%,transparent 0 50%) 0 0/4px 4px}
.sheet{position:relative;width:100%;max-height:calc(100% - 20px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:#fff;
  box-shadow:0 -4px 0 0 var(--ink),inset 0 4px 0 0 var(--gold);animation:up .24s steps(4,end)}
@keyframes up{from{transform:translateY(30%)}to{transform:none}}
.sheet-head{display:flex;align-items:center;gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:4px solid var(--line)}
.sheet-head h2{margin:0;flex:1;min-width:0;display:flex;--ps:2}
.sheet-body{overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lead{margin:0 0 14px;color:var(--ink-2);font-size:15px}
.small{margin:10px 0 0;color:var(--ink-2);font-size:13px}
.err{margin:12px 0 0;min-height:1.4em;color:var(--minus);font-size:14px;font-weight:700}
.status{margin:14px 0 0;min-height:1.4em;font-size:14px;font-weight:700;color:var(--plus)}
.status.err{color:var(--minus)}
.notice{margin:0 4px 14px;padding:10px 12px;background:var(--cream);box-shadow:var(--px2);font-size:14px}
.notice a{color:var(--velvet);font-weight:700;text-underline-offset:3px}
.foot .warn{color:var(--minus);font-weight:700}

/* 篩選 */
.ystep{display:flex;align-items:center;justify-content:center;gap:8px}
.ystep .yr{font:400 18px/1.4 var(--f-px);min-width:124px;text-align:center}
.ystep .btn{--is:3}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:16px 2px 0}
.chip{appearance:none;border:0;margin:2px;background:#fff;color:var(--ink);font:700 14px var(--f-body);padding:7px 0;cursor:pointer;position:relative;box-shadow:var(--px2);-webkit-tap-highlight-color:transparent}
.chip.all{grid-column:1/-1}
.chip[aria-pressed="true"]{background:var(--gold);box-shadow:var(--px2),inset 0 -3px 0 var(--gold-2)}
.chip .dot{position:absolute;top:3px;right:3px;width:4px;height:4px;background:var(--velvet)}
.chip:focus-visible{outline:3px dashed var(--velvet);outline-offset:3px}

/* 記錄列表 */
.ledger{margin-top:20px}
.lhead,.lrow{display:grid;grid-template-columns:minmax(max-content,1fr) minmax(max-content,1fr) minmax(0,1fr);gap:12px;align-items:center;justify-items:center;text-align:center;padding:10px 6px}
.ledger.editable .lhead,.ledger.editable .lrow{grid-template-columns:minmax(max-content,1fr) minmax(max-content,1fr) minmax(0,1fr) auto}
.lhead{border-bottom:4px solid var(--ink);padding-block:6px;--ps:1}
.lrows{list-style:none;margin:0;padding:0}
.lrow{border-bottom:2px solid var(--line)}
.lrow:nth-child(even){background:var(--cream)}
.c-date b{display:block;font:400 14px/1.5 var(--f-px)}
.c-date small{display:block;font-size:12px;color:var(--ink-2);line-height:1.3}
.c-amt{display:grid;justify-items:center;gap:4px;font:400 14px/1.5 var(--f-px)}
.plus{color:var(--plus)} .minus{color:var(--minus)}
.c-note{min-width:0;overflow-wrap:anywhere;font-size:15px}
.c-note .nil{color:var(--ink-2)}
.lrow .btn-sm{margin:2px 2px 6px}
.empty{margin:0;padding:28px 8px;text-align:center;color:var(--ink-2);background:var(--cream)}
.sum{margin:22px 4px 4px;padding:14px 16px;background:var(--gold-soft);box-shadow:var(--px4);display:grid;gap:6px}
.sum p{margin:0 0 4px;font-size:13px;color:var(--ink-2)}
.sum div{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sum .v{font:400 15px/1.5 var(--f-px)}
.sum .grand{margin-top:6px;padding-top:10px;border-top:4px dotted var(--ink);font-weight:700}
.sum .grand .v{font:400 16px var(--f-num)}

/* 下載 */
.dl-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:18px 4px 0;padding:12px 6px;background:var(--cream);box-shadow:var(--px2)}
.dl-sum div{display:grid;justify-items:center;gap:2px;min-width:0}
.dl-sum span{font-size:12px;color:var(--ink-2)}
.dl-sum b{font:400 13px/1.6 var(--f-px);white-space:nowrap}
.dl-btns{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:20px}

/* 管理員 */
.admin-bar{display:flex;align-items:center;gap:8px;margin:0 0 16px;padding:8px 12px;background:var(--cream);font-size:14px;font-weight:700;--is:2}
.admin-bar .linkbtn{margin-left:auto}
.linkbtn{appearance:none;border:0;background:none;padding:4px 2px;font:700 14px var(--f-body);color:var(--velvet);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.field{display:grid;gap:8px;margin-top:18px;--ps:1}
.field:first-child{margin-top:0}
.pw-in,.money-in{display:flex;align-items:center;gap:6px;background:#fff;box-shadow:var(--px4);margin:4px;padding:0 12px}
.pw-in:focus-within,.money-in:focus-within{background:var(--gold-soft)}
.pw-in input,.money-in input{appearance:none;border:0;background:none;outline:none;flex:1;min-width:0;padding:12px 2px;color:var(--ink);border-radius:0}
.pw-in input{font:400 16px/1.4 var(--f-px);letter-spacing:.08em;width:100%}
.money-in span{font:400 11px var(--f-px);color:var(--ink-2)}
.money-in input{font:400 17px/1.4 var(--f-px);text-align:right;width:100%}
.inc .money-in input{color:var(--plus)} .exp .money-in input{color:var(--minus)}
.money{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.money .field{margin-top:0;min-width:0}
.picker{position:relative;display:grid;grid-template-columns:1.2fr 1fr 1fr;height:calc(var(--ih)*5);overflow:hidden;background:#fff;box-shadow:var(--px4);margin:4px}
.picker.note{grid-template-columns:1fr}
.picker::before{content:"";position:absolute;left:0;right:0;top:calc(var(--ih)*2);height:var(--ih);background:var(--gold-soft);box-shadow:inset 0 3px 0 var(--ink),inset 0 -3px 0 var(--ink);pointer-events:none}
.picker::after{content:"";position:absolute;left:8px;top:calc(var(--ih)*2.5 - 7px);width:8px;height:14px;background:var(--velvet);
  clip-path:polygon(0 0,25% 0,25% 14.3%,50% 14.3%,50% 28.6%,75% 28.6%,75% 42.9%,100% 42.9%,100% 57.1%,75% 57.1%,75% 71.4%,50% 71.4%,50% 85.7%,25% 85.7%,25% 100%,0 100%);pointer-events:none;z-index:2}
.wheel{position:relative;z-index:1;height:calc(var(--ih)*5);overflow-x:hidden;overflow-y:auto;overscroll-behavior-x:none;scroll-snap-type:y mandatory;scrollbar-width:none;perspective:480px;outline:none;overscroll-behavior:contain;touch-action:pan-y}
.wheel::-webkit-scrollbar{display:none}
.wheel:focus-visible{box-shadow:inset 0 0 0 3px var(--velvet)}
.wheel-pad{height:calc(var(--ih)*2)}
.wheel-item{height:var(--ih);display:flex;align-items:center;justify-content:center;gap:2px;scroll-snap-align:center;font:400 15px var(--f-px);color:var(--ink);user-select:none;-webkit-user-select:none;cursor:pointer;white-space:nowrap;backface-visibility:hidden}
.wheel-item.on{color:var(--velvet)}
.picker.note .wheel-item{font:700 18px var(--f-body)}
.date-txt{margin:2px 4px 0;font-size:14px;font-weight:700;color:var(--velvet)}
.note-in{appearance:none;border:0;border-radius:0;outline:none;margin:6px 4px 4px;padding:12px;font:600 16px var(--f-body);box-shadow:var(--px4);background:#fff;color:var(--ink)}
.note-in:focus{background:var(--gold-soft)}
.save-row{display:grid;gap:12px;margin-top:20px}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.sub-nav{display:grid;gap:12px;margin-top:28px;padding-top:20px;border-top:4px dotted var(--line)}
/* 操作紀錄 */
.logs{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:12px}
.log{margin:2px;padding:10px 12px;background:#fff;box-shadow:var(--px2);display:grid;gap:6px}
.log:nth-child(even){background:var(--cream)}
.log-top{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.log-time{font:400 11px/1.4 var(--f-px);color:var(--ink-2)}
.log-who{font-weight:700;font-size:15px}
.tag{margin:2px;padding:0 8px;font-size:13px;font-weight:700;line-height:1.6;box-shadow:var(--px2)}
.tag.add{background:#DDF1E4;color:var(--plus)} .tag.edit{background:var(--gold-soft);color:#7A5A0E} .tag.del{background:#FBE3DF;color:var(--minus)}
.log-body{display:grid;gap:2px;font-size:14px;overflow-wrap:anywhere}
.log-body .diff{color:var(--velvet);font-weight:700}
.log-body .diff::before{content:'▸ '}
.more{margin-top:16px}
.back{margin-bottom:12px}

.welcome-wrap{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
.welcome-scrim{position:absolute;inset:0;background:rgba(36,19,17,.35)}
.welcome{position:relative;width:min(340px,100%);box-sizing:border-box;background:#fff;padding:22px 18px 16px;display:grid;justify-items:center;gap:10px;text-align:center;
  box-shadow:var(--px4),0 8px 0 0 var(--ink),inset 0 0 0 4px var(--gold);animation:pop .3s steps(3,end)}
@keyframes pop{from{transform:scale(.6)}to{transform:none}}
.welcome h2{margin:0;--ps:2}
.welcome p{margin:0;color:var(--ink-2);font-size:14px;text-wrap:balance}
.welcome-bag{display:block;width:96px;height:140px;image-rendering:pixelated}
.welcome .btn{margin-top:8px;min-width:60%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--gold-soft);color:var(--ink);font-weight:700;font-size:15px;padding:10px 18px;box-shadow:var(--px4),0 8px 0 0 var(--ink);max-width:calc(100% - 56px);text-align:center}

@media (min-width:430px){
  :root{--title-s:3}
}
@media (min-width:760px){
  :root{--bag-s:6;--title-s:4;--ih:46px}
  .topbar{padding-top:20px}
  .stg canvas{width:96px;height:140px}
  .stages{gap:10px}
  .stg span{font-size:11px}
  .actions{grid-template-columns:repeat(3,1fr);max-width:1000px;gap:20px;margin-top:48px}
  .btn-main{flex-direction:column;justify-content:center;min-height:150px;gap:16px}
  .btn-main .chev{display:none}
  .sheet-wrap{align-items:center}
  .sheet{width:min(700px,calc(100% - 72px));max-height:min(88vh,900px);margin:4px;box-shadow:var(--px4),0 8px 0 0 var(--ink),inset 0 0 0 4px var(--gold)}
  .sheet-head{padding:20px 28px 14px}
  .sheet-body{padding:20px 28px 32px}
  .dl-sum{gap:8px;padding:12px}
  .dl-btns{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lhead,.lrow{padding:10px 12px}
  .c-date b{display:inline;margin-right:8px}
  .c-date small{display:inline}
}
@media (max-width:370px){
  :root{--bag-s:4;--title-s:2}
  .stages{grid-template-columns:repeat(3,auto)}
  .months{grid-template-columns:repeat(4,1fr)}
  .money{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .bag-btn.hop .bag-cv,.sheet,.say.show,.welcome{animation:none}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script id="main">(function () {
'use strict';
/* ===== 點陣奉獻袋（64×76 格） ===== */
var BAG_W = 64, BAG_H = 76;
var PAL = {
  K: '#26100D', b: '#6E2A22', s: '#511D17', d: '#3A130F', h: '#8C3B30', H: '#A8513F',
  r: '#7D3329', R: '#5C2219', q: '#9B4A3B', Q: '#B5604C',
  i: '#2A0E0B',
  g: '#F2C230', G: '#FFE27A', o: '#C98E17', O: '#8A5A0E',
  u: '#A5D3F3', U: '#5B95CF', n: '#2F5F93',
  p: '#F4A497', m: '#D45A4A', M: '#8E2B22',
  w: '#FFFFFF', y: '#FFF2B0', e: '#ECE3E0', E: '#D9CCC8'

function buildPdf(y, list, opening, hasPrior) {

      ctx.imageSmoothingEnabled = false; ctx.drawImage(t, M, M - 20, t.width * sc, t.height * sc);

    + (editing
      ? '<div class="row-btns"><button class="btn btn-gold" type="button" data-act="save"><span data-px="更新記錄"></span></button><button class="btn" type="button" data-act="cancel"><span data-px="取消"></span></button></div>'
        + '<div class="save-row"><button class="btn btn-danger" type="button" data-act="del"><span data-px="刪除這筆" data-tone="danger"></span></button></div>'
      : '<div class="save-row"><button class="btn btn-gold" type="button" data-act="save"><span data-icon="plus"></span><span data-px="儲存記錄"></span></button></div>'
        + '<div class="sub-nav"><button class="btn wide" type="button" data-act="list"><span data-icon="pencil"></span><span data-px="編輯記錄"></span></button>'
        + '<button class="btn wide" type="button" data-act="log"><span data-icon="clock"></span><span data-px="操作紀錄"></span></button></div>');
  hydrate(body);

  var dateTxt = $('#date-txt');
  function showDate() { var y = yW.value(), m = mW.value(), d = dW.value(); dateTxt.textContent = y + ' 年 ' + m + ' 月 ' + d + ' 日（週' + wk(y, m, d) + '）'; }
  function syncDays() {
    if (!dW) return;
    var n = daysIn(yW.value(), mW.value());
    if (n !== dW.items.length) dW.rebuild(dayItems(yW.value(), mW.value()), Math.min(dW.index, n - 1));
    showDate();
  }
  var dW = null;
  var yW = makeWheel({ aria: '年', items: years.map(function (v) { return { label: v + ' 年', value: v }; }), index: years.indexOf(y0), onChange: syncDays });
  var mW = makeWheel({ aria: '月', items: range(1, 12).map(function (v) { return { label: v + ' 月', value: v }; }), index: m0 - 1, onChange: syncDays });
  dW = makeWheel({ aria: '日', items: dayItems(y0, m0), index: d0 - 1, onChange: showDate });
  var pk = $('#pk-date'); pk.appendChild(yW.el); pk.appendChild(mW.el); pk.appendChild(dW.el);
  showDate();

  var noteItems = [NOTE_NONE].concat(NOTE_PRESETS, [NOTE_CUSTOM]).map(function (v) { return { label: v, value: v }; });
  var nIdx = 1, noteIn = $('#f-note');
  if (editing) {
    if (!rec.note) nIdx = 0;
    else if (NOTE_PRESETS.indexOf(rec.note) >= 0) nIdx = NOTE_PRESETS.indexOf(rec.note) + 1;
    else { nIdx = noteItems.length - 1; noteIn.value = rec.note; noteIn.hidden = false; }
  }
  var nW = makeWheel({ aria: '備註', items: noteItems, index: nIdx, onChange: function (v) { noteIn.hidden = v !== NOTE_CUSTOM; } });
  $('#pk-note').appendChild(nW.el);

  var incEl = $('#f-inc'), expEl = $('#f-exp');
  [incEl, expEl].forEach(function (el) {
    el.addEventListener('focus', function () { el.value = el.value.replace(/,/g, ''); });
    el.addEventListener('input', function () { var v = el.value.replace(/[^\d]/g, ''); if (v !== el.value) el.value = v; });
    el.addEventListener('blur', function () { var v = el.value.replace(/[^\d]/g, ''); el.value = v ? fmt(parseInt(v, 10)) : ''; });
  });
  function parseAmt(s) { s = String(s || '').replace(/[,\s]/g, ''); if (!s) return 0; if (!/^\d+$/.test(s)) return NaN; return parseInt(s, 10); }

  var armT = 0;
  body.onclick = function (e) {
    var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    var act = b.getAttribute('data-act'), er = $('#f-err');
    if (act === 'lock') return lockAdmin();
    if (act === 'list') return renderAdmin('list');
    if (act === 'log') return renderAdmin('log');
    if (act === 'cancel') return renderAdmin('list');
    if (act === 'del') {
      if (!b.classList.contains('armed')) {
        b.classList.add('armed'); b.textContent = ''; b.appendChild(pxEl('再按一次確認刪除', 16, 'danger'));
        SFX.err(); clearTimeout(armT);
        armT = setTimeout(function () { if (b.isConnected) { b.classList.remove('armed'); b.textContent = ''; b.appendChild(pxEl('刪除這筆', 16, 'danger')); } }, 4000);
        return;
      }
      return commit({ action: 'del', id: rec.id }, '已刪除 ' + dateStr(rec) + ' 的記錄', 'list', b);
    }
    if (act === 'save') {
      er.textContent = '';
      var inc = parseAmt(incEl.value), exp = parseAmt(expEl.value);
      if (isNaN(inc) || isNaN(exp)) { er.textContent = '金額只能填數字。'; SFX.err(); return; }
      if (!inc && !exp) { er.textContent = '收入或支出至少要填一個。'; SFX.err(); return; }
      if (inc > 9999999 || exp > 9999999) { er.textContent = '金額太大了，請再確認一次。'; SFX.err(); return; }
      var note = nW.value();
      if (note === NOTE_NONE) note = ''; else if (note === NOTE_CUSTOM) note = noteIn.value.trim().slice(0, 40);
      var r2 = { id: editing ? rec.id : newId(), y: yW.value(), m: mW.value(), d: dW.value(), income: inc, expense: exp, note: note, t: editing ? (rec.t || Date.now()) : Date.now() };
      if (editing && rkey(r2) === rkey(rec) && r2.income === (rec.income || 0) && r2.expense === (rec.expense || 0) && r2.note === (rec.note || '')) {
        er.textContent = '內容沒有變動，不需要更新。'; return;
      }
      var desc = r2.m + '/' + r2.d + ' ' + (inc ? '收入 ' + fmt(inc) : '') + (inc && exp ? '、' : '') + (exp ? '支出 ' + fmt(exp) : '');
      var payload = { y: r2.y, m: r2.m, d: r2.d, income: r2.income, expense: r2.expense, note: r2.note };
      commit(editing ? { action: 'edit', id: rec.id, rec: payload } : { action: 'add', rec: payload },
        (editing ? '已更新 ' : '已新增 ') + desc, editing ? 'list' : 'add', b);
    }
  };
}

function renderEditList() {
  setTitle('編輯記錄');
  var body = $('#sheet-body'), f = admin.listF;
  function draw() {
    body.textContent = '';
    var top = document.createElement('div');
    top.innerHTML = adminBar()
      + '<button class="btn btn-sm back" type="button" data-act="add"><span data-icon="left"></span><span data-px="返回新增"></span></button>'
      + '<p class="lead">找到要修改的那一筆，按「編輯」。</p>';
    hydrate(top);
    while (top.firstChild) body.appendChild(top.firstChild);
    body.appendChild(filterBlock(f, draw));
    var list = STATE.records.filter(function (r) { return inPeriod(r, f.y, f.m); }).sort(sortAsc).reverse();
    body.appendChild(ledgerEl(list, f, true));
  }
  body.onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'lock') lockAdmin();
    else if (act === 'add') renderAdmin('add');
    else if (b.hasAttribute('data-edit')) renderAdmin('edit', { id: b.getAttribute('data-edit') });
  };
  draw();
}

/* ---------- 操作紀錄（每次新增、修改、刪除都記一筆） ---------- */
function slimRec(r) { return { id: r.id, y: r.y, m: r.m, d: r.d, income: r.income || 0, expense: r.expense || 0, note: r.note || '' }; }
function recLine(r) {
  var money = (r.income ? '收入 +' + fmt(r.income) : '') + (r.income && r.expense ? '、' : '') + (r.expense ? '支出 -' + fmt(r.expense) : '');
  return dateStr(r) + '（週' + wk(r.y, r.m, r.d) + '） ' + money + (r.note ? '・' + r.note : '');
}
function logDetail(e) {
  var r = e.rec || {}, p = e.prev;
  if (!p) return '<span class="chg">' + esc(recLine(r)) + '</span>';
  var ch = [];
  if (rkey(p) !== rkey(r)) ch.push('日期 ' + dateStr(p) + ' → ' + dateStr(r));
  if ((p.income || 0) !== (r.income || 0)) ch.push('收入 ' + fmt(p.income || 0) + ' → ' + fmt(r.income || 0));
  if ((p.expense || 0) !== (r.expense || 0)) ch.push('支出 ' + fmt(p.expense || 0) + ' → ' + fmt(r.expense || 0));
  if ((p.note || '') !== (r.note || '')) ch.push('備註 ' + (p.note || '（無）') + ' → ' + (r.note || '（無）'));
  return '<span class="chg">' + esc(recLine(p)) + '</span>'
    + ch.map(function (c) { return '<span class="chg diff">' + esc(c) + '</span>'; }).join('');
}
function renderLog() {
  setTitle('操作紀錄');
  var body = $('#sheet-body'), shown = 30, LOG = null, logErr = '', seq = panelSeq;
  function draw() {
    var all = (LOG || []).slice().reverse();
    var h = adminBar()
      + '<button class="btn btn-sm back" type="button" data-act="add"><span data-icon="left"></span><span data-px="返回新增"></span></button>'
      + '<p class="lead">每次新增、修改、刪除記錄都會自動記在這裡，最新的在最上面。' + (LOG ? '共 ' + all.length + ' 筆。' : '') + '</p>';
    if (!LOG) h += '<p class="empty">' + (logErr || '讀取中…') + '</p>';
    else if (!all.length) h += '<p class="empty">還沒有任何操作紀錄。</p>';
    else {
      h += '<ul class="logs">';
      all.slice(0, shown).forEach(function (e) {
        var u = tpe(e.t), cls = e.act === '新增' ? 'add' : e.act === '刪除' ? 'del' : 'edit';
        h += '<li class="log"><div class="log-top"><span class="log-time">' + u.y + '/' + pad(u.m) + '/' + pad(u.d) + ' ' + pad(u.hh) + ':' + pad(u.mi) + '</span>'
          + '<span class="tag ' + cls + '">' + esc(e.act || '更新') + '</span><span class="log-who">' + esc(e.by || '（未記名）') + '</span></div>'
          + '<div class="log-body">' + logDetail(e) + '</div></li>';
      });
      h += '</ul>';
      if (all.length > shown) h += '<button class="btn wide more" type="button" data-act="more"><span data-px="顯示更早的紀錄"></span></button>';
    }
    body.innerHTML = h; hydrate(body);
  }
  body.onclick = function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'lock') lockAdmin();
    else if (act === 'add') renderAdmin('add');
    else if (act === 'more') { shown += 30; SFX.tick(); draw(); }
  };
  draw();
  apiCall({ action: 'log', token: admin.token }).then(function (j) {
    keepAlive();
    if (seq !== panelSeq || curPanel !== 'admin') return;
    LOG = j.log || []; draw();
  }, function (e) {
    if (seq !== panelSeq || curPanel !== 'admin') return;
    if (e.code === 'bad_token') return sessionExpired();
    logErr = errMsg(e.code); draw();
  });
}

/* ---------- 管理員登入成功的歡迎小視窗 ---------- */
var welcomeOpen = false;
function greet() { var h = tpe().hh; return h >= 5 && h < 11 ? '早安' : h >= 11 && h < 18 ? '午安' : '晚安'; }
function openWelcome(name) {
  var t = $('#welcome-title'), c = $('#welcome-bag'), x = c.getContext('2d');
  t.textContent = ''; t.appendChild(pxEl('歡迎，' + name + '！', 16, 'title'));
  $('#welcome-desc').textContent = greet() + '！管理員模式已解鎖，60 分鐘內不用再輸入密碼。';
  x.clearRect(0, 0, 48, 70); x.drawImage(STAGE_CV[curStage], 8, 4, 48, 70, 0, 0, 48, 70);
  $('#welcome').hidden = false; welcomeOpen = true;
  setTimeout(function () { var ok = $('#welcome-ok'); try { ok.focus({ preventScroll: true }); } catch (e) { ok.focus(); } }, 30);
}
function closeWelcome() {
  if (!welcomeOpen) return;
  welcomeOpen = false; $('#welcome').hidden = true; SFX.open();
  var f = $('#sheet-x'); if (f && !$('#sheet').hidden) try { f.focus({ preventScroll: true }); } catch (e) { }
}

/* ---------- 存檔：送到記錄伺服器（新增／修改／刪除） ---------- */
function commit(op, msg, nextView, btn) {
  var er = $('#f-err') || { textContent: '' };
  if (!admin.token) return sessionExpired();
  op.token = admin.token;
  if (btn) btn.disabled = true; er.textContent = '儲存中…';
  apiCall(op).then(function (j) {
    keepAlive(); applyData(j); renderTotals(true); SFX.ok(); toast(msg);
    if (curPanel === 'admin') renderAdmin(nextView);
  }, function (e) {
    if (btn && btn.isConnected) btn.disabled = false;
    if (e.code === 'bad_token') return sessionExpired();
    er.textContent = errMsg(e.code); SFX.err();
    if (e.code === 'not_found') { toast(errMsg(e.code)); loadData().then(function () { if (curPanel === 'admin') renderAdmin('list'); }); }
  });
}

/* ---------- 畫面骨架與啟動 ---------- */
function btnMain(key, icon, label) {
  return '<button type="button" class="btn btn-main" data-open="' + key + '"' + (key === 'admin' ? ' id="btn-admin"' : '') + '>'
    + '<span data-icon="' + icon + '"></span><span data-px="' + label + '"></span><span data-icon="right" class="chev"></span></button>';
}
var app = document.getElementById('app');
app.innerHTML = '<div class="wrap">'
  + '<div class="topbar"><button type="button" class="btn btn-icon" id="mute"></button></div>'
  + '<header class="hero">'
  + '<h1 class="hero-title"><span data-px="' + TITLE + '" data-tone="title"></span></h1>'
  + '<div class="bag-stage">'
  + '<button class="bag-btn" id="bag" type="button" aria-label="奉獻袋，點一下有動畫和音效"><canvas class="bag-cv" id="bag-cv" width="64" height="76"></canvas></button>'
  + '<canvas class="fx-cv" id="fx-cv" width="' + FX_W + '" height="' + FX_H + '" aria-hidden="true" style="left:' + (-FX_L / BAG_W * 100) + '%;top:' + (-FX_T / BAG_H * 100) + '%;width:' + (FX_W / BAG_W * 100) + '%;height:' + (FX_H / BAG_H * 100) + '%"></canvas>'
  + '<div class="say" id="say" hidden></div><div class="ptag" id="ptag" hidden></div>'
  + '</div>'
  + '<p class="hint">點一下錢袋 ♪</p>'
  + '<section class="total" aria-live="polite">'
  + '<h2><span data-px="目前累積金額" data-tone="sub"></span></h2>'
  + '<div class="amount"><small>NT$</small><span id="amount">0</span></div>'
  + '<div class="bar" id="bar" aria-hidden="true"></div>'
  + '<p class="next" id="next"></p>'
  + '</section>'
  + '<p class="stage-cap">錢袋會隨累積金額換樣子，點小圖可以預覽</p>'
  + '<div class="stages" id="stages" role="group" aria-label="錢袋階段預覽"></div>'
  + '</header>'
  + '<nav class="actions" aria-label="功能">' + btnMain('view', 'list', '查看奉獻記錄') + btnMain('dl', 'down', '下載奉獻記錄') + btnMain('admin', 'lock', '新增記錄') + '</nav>'
  + '<footer class="foot" id="foot"></footer>'
  + '</div>'
  + '<div class="sheet-wrap" id="sheet" hidden><div class="scrim" data-close></div>'
  + '<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">'
  + '<header class="sheet-head"><h2 id="sheet-title"></h2><button type="button" class="btn btn-icon" id="sheet-x" data-close aria-label="關閉"><span data-icon="x"></span></button></header>'
  + '<div class="sheet-body" id="sheet-body"></div></section></div>'
  + '<div class="welcome-wrap" id="welcome" hidden><div class="welcome-scrim" data-wclose></div>'
  + '<section class="welcome" role="dialog" aria-modal="true" aria-labelledby="welcome-title" aria-describedby="welcome-desc">'
  + '<canvas class="welcome-bag" id="welcome-bag" width="48" height="70" aria-hidden="true"></canvas>'
  + '<h2 id="welcome-title"></h2><p id="welcome-desc"></p>'
  + '<button type="button" class="btn btn-gold" id="welcome-ok" data-wclose><span data-px="開始記錄"></span></button>'
  + '</section></div>'
  + '<div class="toast" id="toast" role="status" hidden></div>';
hydrate(app);
buildStages();
updateMute();
updateAdminBtn();
renderTotals(true);

$('#bag').addEventListener('click', tapBag);
$('#mute').addEventListener('click', function () {
  muted = !muted; lsSet('mute', muted); updateMute();
  if (!muted) { audio(); SFX.open(); }
});
$('.actions').addEventListener('click', function (e) { var b = e.target.closest('[data-open]'); if (b) { SFX.open(); openPanel(b.getAttribute('data-open')); } });
$('#sheet').addEventListener('click', function (e) { if (e.target.closest('[data-close]')) closePanel(); });
$('#welcome').addEventListener('click', function (e) { if (e.target.closest('[data-wclose]')) closeWelcome(); });
window.addEventListener('resize', function () { if (curPanel === 'dl') fitNums($('#sheet-body')); });
document.addEventListener('keydown', function (e) {
  if (welcomeOpen) {
    if (e.key === 'Escape') { e.preventDefault(); closeWelcome(); }
    else if (e.key === 'Tab') { e.preventDefault(); $('#welcome-ok').focus(); }
    return;
  }
  if ($('#sheet').hidden) return;
  if (e.key === 'Escape') { closePanel(); return; }
  if (e.key === 'Tab') {
    var f = Array.prototype.filter.call($('#sheet .sheet').querySelectorAll('button,input,[tabindex="0"]'), function (el) { return !el.disabled && !el.hidden && el.offsetParent !== null; });
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { f[f.length - 1].focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { f[0].focus(); e.preventDefault(); }
  }
});
document.addEventListener('pointerdown', function () { if (!muted) audio(); }, { once: true, capture: true });

loadData();
/* 網頁放著很久再回來看時，自動抓一次最新記錄 */
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && Date.now() - loadedAt > 120000) loadData();
});

})();
</script>
</body>
</html>
